<div class="row">
  <div class="col-md-4 mb-4" *ngFor="let product of products">

    <div class="card h-100 shadow">
      <img [src]="product.image" class="card-img-top">

      <div class="card-body">
        <h5>{{ product.name }}</h5>
        <p>₹ {{ product.price }}</p>

        <a
          [routerLink]="['/product', product.id]"
          class="btn btn-primary"
        >
          View Details
        </a>
      </div>
    </div>

  </div>
</div>
